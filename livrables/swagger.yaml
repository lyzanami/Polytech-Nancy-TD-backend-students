openapi: 3.0.3
info:
    title: TODO API
    version: 1.0.0
    description: >
        API de gestion d'une TODO List.
servers:
    -   url: http://localhost:8080
        description: Serveur local de développement

tags:
    -   name: tasks
        description: Opérations sur les tâches

paths:
    /tasks:
        post:
            tags: [ tasks ]
            summary: Créer une tâche
            operationId: createTask
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Task'
            responses:
                '201':
                    description: Tâche créée avec succès
                    headers:
                        Location:
                            description: URL de la ressource créée
                            schema:
                                type: string
                                example: /tasks/1
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Task'
            get:
                tags: [ tasks ]
                summary: Récupérer toutes les tâches
                operationId: getTasks
                parameters:
                - name: todo_only
                    in: query
                    description: Retourne les tâches à réaliser
                    required: false
                    schema:
                    type: boolean
                responses:
                '200':
                    description: Liste des tâches récupérée
                    content:
                    application/json:
                        schema:
                        type: array
                        items:
                            $ref: '#/components/schemas/Task'
                '204':
                    description: Not Found

    /tasks/{id}:
        parameters:
            -   in: path
                name: id
                required: true
                description: Identifiant numérique de la tâche
                schema:
                    type: integer
                    minimum: 1
        get:
            tags: [ tasks ]
            summary: Récupérer une tâche
            description: Récupérer une tâche par son identifiant
            operationId: getTaskById
            responses:
                '200':
                    description: Tâche trouvée avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Task'
                '404':
                    description: Not Found

        put:
            tags: [ tasks ]
            summary: Modifier une tâche
            operationId: updateTask
            requestBody:
            required: true
            content:
                application/json:
                schema:
                    $ref: '#/components/schemas/Task'
            responses:
            '204':
                description: Tâche modifiée
            '404':
                description: Not Found

        delete:
            tags: [ tasks ]
            summary: Supprimer une tâche
            operationId: deleteTask
            responses:
            '204':
                description: Tâche supprimée
            '404':
                description: Not Found

components:
    schemas:
        Task:
            type: object
            description: Représentation d'une tâche
            properties:
                id:
                    type: integer
                    example: 1
                title:
                    type: string
                    nullable: false
                    example: Acheter du lait
                description:
                    type: string
                    nullable: true
                    example: 2L demi-écrémé
                done:
                    type: boolean
                    nullable: false
                    example: false
            required:
                - id
                - title
